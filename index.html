<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Althea Properties Milano</title>
<meta name="theme-color" content="#600114">
<style>
  @font-face { font-family: Montserrat; src: url(Montserrat-Light.ttf); font-weight: 300; font-display: swap; }
  :root { --oro: #d8bfa3; --filo: rgba(216, 191, 163, .4); }
  html { height: 100%; background: #43000d; }
  body {
    min-height: 100%; margin: 0; box-sizing: border-box; padding: 56px 36px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse 90% 75% at 50% 42%, #7d0b22 0%, #600114 48%, #43000d 100%);
    color: #fff; font: 300 15px/1.7 Montserrat, "Century Gothic", sans-serif; text-align: center;
  }
  body::before { content: ""; position: fixed; inset: 20px; border: 1px solid var(--filo); pointer-events: none; }
  img { display: block; width: min(76vw, 420px); height: auto; }
  h1 { margin: 44px 0 0; font: inherit; font-size: 13px; letter-spacing: .34em; margin-right: -.34em; color: var(--oro); }
  .rombo { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
  .rombo::before, .rombo::after { content: ""; width: 56px; height: 1px; background: var(--filo); }
  .rombo i { width: 7px; height: 7px; border: 1px solid var(--oro); transform: rotate(45deg); }
  p { margin: 0; }
  .info { font-size: 12px; letter-spacing: .2em; margin-right: -.2em; color: var(--oro); }
  .contatti { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 26px; margin-top: 6px; }
  a { color: inherit; text-decoration: none; border-bottom: 1px solid transparent; transition: border-color .25s; }
  a:hover, a:focus-visible { border-color: var(--oro); }
  @media (max-width: 480px) {
    body { padding: 48px 32px; }
    body::before { inset: 14px; }
    h1 { margin-top: 36px; }
  }
</style>
</head>
<body>
  <img src="logo.png?v=2" width="750" height="510" alt="Althea Properties Milano">
  <h1>SITO IN ALLESTIMENTO</h1>
  <div class="rombo" aria-hidden="true"><i></i></div>
  <p class="info">PER INFO</p>
  <p class="contatti"><a href="mailto:info@altheaproperties.it">info@altheaproperties.it</a> <a href="tel:+393884224554">+39 388 422 4554</a></p>
</body>
</html>
